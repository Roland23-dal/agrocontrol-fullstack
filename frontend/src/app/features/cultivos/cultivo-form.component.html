<nav class="migas" aria-label="Ruta de navegación"><a routerLink="/cultivos">Cultivos</a> / {{ esEdicion ? 'Editar' : 'Nuevo' }}</nav>
<header class="page-header">
  <div>
    <h1>{{ esEdicion ? 'Editar cultivo' : 'Nuevo cultivo' }}</h1>
    <p>Los campos marcados con * son obligatorios.</p>
  </div>
</header>

@if (cargando()) {
  <div class="cargando">Cargando datos...</div>
} @else {
  <form class="form-tarjeta" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    @if (error()) {
      <div class="alerta alerta--error" role="alert">{{ error() }}</div>
    }

    <div class="form-grid">
      <div class="campo">
        <label for="nombre">Nombre del cultivo *</label>
        <input id="nombre" type="text" formControlName="nombre" placeholder="Ej. Arroz" />
        <app-field-error [control]="f.nombre" />
      </div>

      <div class="campo">
        <label for="variedad">Variedad</label>
        <input id="variedad" type="text" formControlName="variedad" placeholder="Ej. NIR-1" />
        <app-field-error [control]="f.variedad" />
      </div>

      <div class="campo">
        <label for="ciclo">Ciclo estimado (días)</label>
        <input id="ciclo" type="number" min="1" step="1" formControlName="cicloDiasEstimado" />
        <span class="ayuda">Número entero de días entre la siembra y la cosecha.</span>
        <app-field-error [control]="f.cicloDiasEstimado" patron="Ingresa un número entero de días" />
      </div>
    </div>

    <div class="form-acciones">
      <button type="submit" class="btn" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Guardar' }}</button>
      <a class="btn btn--contorno" routerLink="/cultivos">Cancelar</a>
    </div>
  </form>
}
