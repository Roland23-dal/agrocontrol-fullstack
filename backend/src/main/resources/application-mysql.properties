# ==========================================================
# Perfil "mysql": usa MySQL en lugar de H2
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (o en VS Code: agregar --spring.profiles.active=mysql a los argumentos)
# Requisitos: servidor MySQL 8 activo en localhost:3306
# La base agrocontrol_db se crea automaticamente si no existe.
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/agrocontrol_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update: conserva los datos entre ejecuciones
spring.jpa.hibernate.ddl-auto=update

# No se ejecuta data.sql (evita duplicar datos en cada arranque);
# los roles y usuarios de prueba los crea DataInitializer solo si no existen.
spring.sql.init.mode=never
