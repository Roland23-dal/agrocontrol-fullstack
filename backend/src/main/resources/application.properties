# ==========================================================
# AgroControl - Configuracion de la aplicacion (APF3 - Unidad 3)
# JPA/Hibernate + Spring Security + JWT + integracion con Angular (CORS)
# ==========================================================

spring.application.name=agrocontrol

# Servidor
server.port=8082

# ----------------------------------------------------------
# Base de datos H2 en memoria (por defecto)
# Para usar MySQL: ejecutar con el perfil "mysql"  (ver application-mysql.properties)
# ----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:agrocontrol_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para revisar los datos y tablas
# Disponible en: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Necesario para serializar relaciones LAZY a JSON dentro de la solicitud HTTP
spring.jpa.open-in-view=true

# Carga de datos de prueba al iniciar (ver data.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ----------------------------------------------------------
# Seguridad JWT
#  - app.jwt.secret: clave secreta en Base64 (minimo 256 bits) usada para firmar los tokens.
#    Se puede sobreescribir con la variable de entorno JWT_SECRET (recomendado en produccion).
#  - app.jwt.expiration-ms: tiempo de vida del token (3600000 ms = 1 hora).
# ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET:X1zvKFUNQLXcc15qilJu4Bg3iiBqA4GFHUjAm+vzPpI=}
app.jwt.expiration-ms=3600000

# ----------------------------------------------------------
# CORS (APF3): origenes del front-end Angular autorizados a llamar a la API.
# Separar con comas si hay varios (por ejemplo, el front desplegado en la nube).
# ----------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
